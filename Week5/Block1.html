<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>Block 1 — Software Testing (31-slide revision)</title>
<style>
:root{--bg:#0B1420;--panel:#162538;--ink:#F5F8FC;--muted:#B6CBDC;--line:#385066;--teal:#6DDDC6;--blue:#75BFFF;--yellow:#FFD67C;--warn:#FF9C8F}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Aptos,Arial,sans-serif}button{font:inherit}
#stage{height:100dvh;width:100vw;position:relative;overflow:hidden}#deck{width:1920px;height:1080px;position:absolute;transform-origin:top left}
.slide{display:none;position:absolute;inset:0;width:1920px;height:1080px;padding:78px 120px 82px;background:var(--bg);overflow:hidden}.slide.active{display:flex;flex-direction:column}
.kicker{font:700 27px Consolas,monospace;letter-spacing:.1em;color:var(--teal);margin:0 0 22px}.title{font-size:78px;line-height:1.08;letter-spacing:-.035em;margin:0 0 22px;max-width:1680px}.subtitle{font-size:37px;line-height:1.23;color:var(--muted);margin:0;max-width:1660px}.content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:18px 0}.hero{font-size:68px;line-height:1.18;font-weight:650;max-width:1570px}.hero strong,.accent{color:var(--yellow)}
.story{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:stretch}.story .panel,.callout{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:39px 45px}.eyebrow{font:700 27px Consolas,monospace;color:var(--teal);letter-spacing:.06em;margin-bottom:18px}.story p{font-size:43px;line-height:1.2;margin:0}.story .warning{border-color:var(--warn)}.story .warning .eyebrow{color:var(--warn)}
.flow{display:flex;align-items:stretch;gap:18px}.flow .step{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:35px 32px}.flow .step .num{font:700 30px Consolas,monospace;color:var(--teal);margin-bottom:22px}.flow .step p{font-size:39px;line-height:1.2;margin:0}.flow .arrow{align-self:center;font-size:47px;color:var(--yellow)}
.record{display:grid;grid-template-columns:1fr 1fr;gap:24px}.record .block{border:2px solid var(--line);background:var(--panel);border-radius:15px;padding:27px 32px}.record .block.after{border-color:var(--yellow)}.record h3{font:700 27px Consolas,monospace;color:var(--teal);margin:0 0 13px}.record .after h3{color:var(--yellow)}.record p{font-size:32px;line-height:1.2;margin:0}.record .full{grid-column:1/-1}.record strong{color:var(--ink)}
.task{border:2px solid var(--teal);border-radius:18px;padding:31px 42px;background:#112331}.task .label{font:700 27px Consolas,monospace;color:var(--teal);margin-bottom:17px}.task p{font-size:44px;line-height:1.17;margin:0}.task .hint{font-size:28px;color:var(--muted);line-height:1.2;margin-top:18px}.reveal{align-self:flex-start;margin-top:16px;border:2px solid var(--yellow);border-radius:10px;background:transparent;color:var(--yellow);font:700 25px Consolas,monospace;padding:10px 20px;cursor:pointer}.answer{margin-top:13px;border:2px solid var(--yellow);border-radius:12px;padding:16px 24px;background:#302d23;font-size:30px;line-height:1.2}.answer[hidden]{display:none}
.lines{display:grid;gap:15px}.line{display:grid;grid-template-columns:315px 1fr;gap:26px;align-items:center;border-bottom:2px solid var(--line);padding:17px 20px;font-size:37px;line-height:1.2}.line:last-child{border:0}.line b{font:700 27px Consolas,monospace;color:var(--teal)}.tag{display:inline-block;font:700 24px Consolas,monospace;color:var(--yellow);border:2px solid var(--yellow);padding:10px 17px;border-radius:9px;margin-top:24px}.footer{font:600 23px Consolas,monospace;color:var(--muted);border-top:2px solid var(--line);padding-top:17px;display:flex;align-items:center;justify-content:space-between;gap:35px;margin-top:10px}.footer span:first-child{max-width:1450px}
.controls{height:64px;border-top:1px solid var(--line);background:#07101a;display:flex;align-items:center;justify-content:center;gap:28px}.controls button{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:700 17px Aptos,Arial,sans-serif;min-width:108px;min-height:43px;cursor:pointer}.controls button:disabled{opacity:.4;cursor:default}.controls span{color:var(--teal);font:700 18px Consolas,monospace;min-width:115px;text-align:center}.controls button:focus-visible,.reveal:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.question-centre{width:100%;text-align:center;font-size:76px;line-height:1.18;font-weight:700;padding:70px 100px}.question-centre strong{color:var(--yellow)}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.choice-card{background:var(--panel);border:2px solid var(--line);padding:35px 30px;min-height:242px}.choice-card b{display:block;font:700 29px Consolas,monospace;color:var(--teal);margin-bottom:24px}.choice-card p{font-size:36px;line-height:1.18;margin:0}
.pixel-layout{display:grid;grid-template-columns:.85fr 1.15fr;gap:38px;align-items:stretch}.pixel-rules{display:grid;gap:22px}.pixel-rule{background:var(--panel);border:3px solid var(--line);padding:31px 35px;display:flex;flex-direction:column;justify-content:center}.pixel-rule p{font-size:36px;line-height:1.2;margin:0}.pixel-rule .eyebrow{margin-bottom:15px}.pixel-demo{min-width:0;display:flex;flex-direction:column;gap:15px}.pixel-screen{height:402px;background:#102033;border:8px solid var(--teal);box-shadow:12px 12px 0 #06111d;padding:24px 28px;font-family:Consolas,monospace;position:relative;overflow:hidden}.pixel-screen:before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.09;background:linear-gradient(90deg,transparent 31px,var(--teal) 32px),linear-gradient(transparent 31px,var(--teal) 32px);background-size:32px 32px}.pixel-header{position:relative;font-size:24px;color:var(--yellow);font-weight:700}.pixel-input{position:relative;font-size:31px;color:var(--ink);margin-top:12px}.pixel-track{height:203px;position:relative;border-bottom:5px dashed var(--line)}.pixel-sprite{position:absolute;left:30px;top:48px;width:94px;height:94px;background:#183d4b;border:7px solid var(--teal);display:grid;place-items:center;z-index:1}.pixel-sprite svg{width:64px;height:64px;image-rendering:pixelated}.pixel-sprite.travel{animation:pixel-travel 1100ms steps(10,end) forwards}.pixel-gate{position:absolute;right:30px;top:35px;min-width:235px;height:128px;border:8px solid var(--yellow);background:#2d2a22;display:grid;place-items:center;text-align:center;font:700 32px Consolas,monospace;color:var(--yellow)}.pixel-screen[data-tone="ok"]{border-color:var(--teal)}.pixel-screen[data-tone="bad"]{border-color:var(--warn)}.pixel-screen[data-tone="bad"] .pixel-gate{border-color:var(--warn);color:var(--warn)}.pixel-status{position:relative;font:700 28px Consolas,monospace;color:var(--ink);padding-top:15px}.pixel-caption{font-size:30px;line-height:1.17;color:var(--muted);min-height:70px}.pixel-actions{display:flex;gap:14px}.pixel-actions button{border:3px solid var(--teal);background:var(--panel);color:var(--ink);font:700 24px Consolas,monospace;padding:10px 18px;min-width:125px;min-height:54px;cursor:pointer}.pixel-actions button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}@keyframes pixel-travel{from{transform:translateX(0)}to{transform:translateX(440px)}}@media(prefers-reduced-motion:reduce){.pixel-sprite.travel{animation:none;transform:translateX(440px)}}
#testing-loop .step:last-child{border-color:var(--warn)}#testing-loop .step p{font-size:34px}
.pixel-screen{height:322px}.pixel-track{height:126px}.pixel-sprite{top:20px;width:76px;height:76px}.pixel-sprite svg{width:52px;height:52px}.pixel-gate{top:12px;min-width:200px;height:90px;font-size:27px}
.visibility-map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;height:92px}.visibility-box{border:4px solid var(--line);background:#192532;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:Consolas,monospace}.visibility-box b{font-size:27px}.visibility-box span{font-size:21px;font-weight:700;letter-spacing:.06em}.visibility-box.allowed{border-color:var(--teal);background:#143832;color:var(--ink)}.visibility-box.allowed span{color:var(--teal)}.visibility-box.active{outline:5px solid var(--yellow);outline-offset:-9px}.visibility-box:not(.allowed) span{color:var(--warn)}
.controls{display:none}
@media print{@page{size:13.333in 7.5in;margin:0}html,body{width:13.333in;height:auto;print-color-adjust:exact;-webkit-print-color-adjust:exact}#stage{height:auto;width:13.333in;overflow:visible}#deck{position:static;transform:none!important;height:auto}.slide,.slide.active{display:flex!important;position:relative;break-after:page;page-break-after:always}.slide:last-child{break-after:auto}.controls,.pixel-actions{display:none}.answer[hidden]{display:block}}
</style>
</head>
<body><main id="stage" aria-label="Introduction to software testing slides"><div id="deck"></div></main><nav class="controls" aria-label="Slide navigation"><button id="prev" type="button">← Previous</button><span id="count" aria-live="polite"></span><button id="next" type="button">Next →</button></nav>
<script>
'use strict';
const slides=[
{id:'cover',part:'BLOCK 1 / INTRODUCTION',title:'Would you trust this sign-in?',sub:'',kind:'hero',body:'One made-up app. One important question: <strong>what would convince you that it works?</strong>',foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'outcome',part:'THE CHALLENGE',title:'What will you be able to do?',sub:'By the end of this block, you can plan a test and explain how people test software.',kind:'lines',rows:[['NOTICE','Describe a problem without guessing its cause.'],['PLAN','Write exact input, steps and an expected result.'],['CHOOSE','Recognise different kinds of test and what each asks.'],['EXPLAIN','Say what a planned test can—and cannot—prove.']]},
{id:'opening-question',part:'03 / PAIR TALK',title:'A training app with sign-in',sub:'Imagine the app lets a student enter an email and password.',kind:'centre',body:'<strong>How would you test its sign-in?</strong>',foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'testing-loop',part:'04 / THE IDEA',title:'Testing is a comparison',sub:'Worked example from a fictional observation card—not a test run by this class.',kind:'flow',steps:[['RULE','Wrong password must not open the account.'],['INPUT','Enter Wrong123! and press Sign in.'],['EXPECT','Error; account stays closed.'],['CARD SAYS','Account opens → mismatch.']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'rule-input',part:'05 / WORKED EXAMPLE',title:'Start with a rule and an input',sub:'Feature: signing in to our fictional training account.',kind:'story',panels:[['RULE','A wrong password must not open the account.'],['INPUT','Email: learner@example.test. Password: Wrong123!']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'predict',part:'06 / YOUR TURN',title:'Predict before checking',sub:'The password in our example is wrong.',kind:'task',label:'WRITE ONE SENTENCE',body:'What should happen <strong>after pressing Sign in</strong>?',hint:'Name two things someone could check on screen.',answer:'An error should appear, and the account should stay closed. This is an expected result, not an observation.'},
{id:'worked-record',part:'07 / MODEL A TEST CASE',title:'Give someone a repeatable plan',sub:'A test case is a set of instructions and a predicted outcome.',kind:'record',blocks:[['BEFORE / STARTING STATE','Training account exists and is signed out.'],['INPUT','learner@example.test + Wrong123!'],['ACTIONS','1. Open sign-in. 2. Enter the details. 3. Press Sign in.'],['EXPECTED RESULT','Show an error; do not open the account.']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'after-execution',part:'08 / DO NOT INVENT RESULTS',title:'Leave the result blank for now',sub:'Planning a test and running it are different jobs.',kind:'record',blocks:[['EXPECTED RESULT','Error shown; account stays closed.'],['ACTUAL RESULT','Not observed: this is an imaginary app.'],['STATUS','Not run.'],['EVIDENCE','None yet.']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'opposite',part:'09 / INDEPENDENT TRY',title:'Now write the opposite test',sub:'The training account has the correct password: Welcome123!',kind:'task',label:'FOUR-MINUTE INDIVIDUAL TASK',body:'Write the <strong>starting state, input, action and expected result</strong> for a successful sign-in.',hint:'Use learner@example.test. Include which account should open.',answer:'Start signed out with the account ready. Enter learner@example.test and Welcome123!, then press Sign in. Expect that account’s signed-in page to open.'},
{id:'process',part:'10 / THE PROCESS',title:'Plan → design → run → report',sub:'A real testing project uses all four steps; today we plan and design.',kind:'flow',steps:[['PLAN','Choose the risk'],['DESIGN','Write the case'],['RUN','Record the real result'],['REPORT','Share what happened']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'first-check',part:'11 / PRIORITISE',title:'Which check would you run first?',sub:'Risk: someone might open an account with a wrong password. Choose one check and justify it.',kind:'choice',options:[['A / CORRECT','Welcome123! → learner account opens.'],['B / WRONG','Wrong123! → error; account stays closed.'],['C / EMPTY','Empty password → no account opens.']],answer:'B checks the stated risk most directly. A confirms normal sign-in; C tests another rejection. For C, treat “empty passwords are refused” as a proposed classroom rule.',foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'lockout',part:'12 / PROPOSED CLASSROOM RULE',title:'What about repeated wrong attempts?',sub:'For this exercise: lock the account after five wrong passwords.',kind:'story',panels:[['AFTER FOUR WRONG TRIES','Account remains unlocked. Wrong passwords still cannot open it.'],['AFTER FIVE WRONG TRIES','Account is locked. No sign-in is allowed.']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'edge',part:'13 / EDGE CASES',title:'What do edge cases look like?',sub:'Real-world account situations: test limits and unusual inputs. These are illustrative classroom rules.',kind:'lines',rows:[['LOCKOUT','Rule: lock after five wrong tries → check four, five and a later attempt.'],['SIGN-UP LENGTH','If a new password needs 8 characters → try 7, 8 and 9.'],['EMPTY FIELD','Press Sign in with no password → expect no account access.']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'risk-review',part:'14 / REVIEW',title:'What could go wrong on a sign-in page?',sub:'Think first. Do not reveal the examples until the class has suggested its own.',kind:'task',label:'PAIR BRAINSTORM',body:'Name <strong>three different failures</strong>: one about access, one about the right account, and one about ease of use.',hint:'Describe what a person would experience, not which code is broken.',answer:'Examples: wrong password opens an account; correct details open someone else’s account; keyboard users cannot reach the Sign in button. These are possible failures to investigate, not observed results.'},
{id:'v-v-question',part:'15 / TWO QUESTIONS',title:'Verification vs validation',sub:'Imagine the written rule says any password may open an account.',kind:'task',label:'THINK → PAIR → REVEAL',body:'If the app follows that rule exactly, is it <strong>built to the rule</strong>? Does it meet people’s <strong>need for safe access</strong>?',hint:'Following instructions does not make unsafe instructions good.',answer:'Verification asks whether the app follows the written rule: yes, in this imagined case. Validation asks whether the rule and product meet real user needs: no, it does not keep accounts safe.'},
{id:'categories',part:'16 / ORGANISE THE QUESTIONS',title:'Categorising tests',sub:'These labels answer different questions; a single test can have several labels.',kind:'lines',rows:[['SCOPE','Unit, integration, system or acceptance: how much?'],['PURPOSE','Functional or quality: what are we judging?'],['EXECUTION','Manual or automated: who or what runs it?'],['VISIBILITY','Black, grey or white box: what can we see?']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'manual-auto',part:'17 / EXECUTION',title:'Manual vs automated',sub:'The same planned check can be carried out in different ways.',kind:'story',panels:[['MANUAL','A person follows the steps, watches the result and records it.'],['AUTOMATED','A script enters the details, checks the result and reports a comparison.']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'manual-how',part:'18 / HANDS-ON METHOD',title:'How do we test manually?',sub:'When a real training app is available, a person can follow this plan.',kind:'lines',rows:[['PREPARE','Start signed out with the test account ready.'],['ENTER','Type learner@example.test and Wrong123!.'],['ACT','Press Sign in once.'],['RECORD','Write what appeared; compare it with “error, no account”.']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'automated-how',part:'19 / SCRIPTED METHOD',title:'How do automated tests work?',sub:'Browser tools such as Playwright or Selenium can carry out repeated sign-in steps.',kind:'lines',rows:[['WRITE','Script the same fictional input and actions.'],['CHECK','Assert an error appears and no account opens.'],['RUN','Use a test runner; repeat after a change.'],['READ','Investigate a failed comparison; a script is not proof of quality.']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'function-quality',part:'20 / PURPOSE',title:'Functional vs non-functional',sub:'Two different questions about the same sign-in page.',kind:'story',panels:[['FUNCTIONAL','Does a wrong password keep the account closed?'],['NON-FUNCTIONAL / QUALITY','Can someone use the page by keyboard? Is it quick and readable?']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'functional-example',part:'21 / FUNCTIONAL EXAMPLE',title:'Does sign-in refuse a wrong password?',sub:'A functional check asks whether a stated behaviour works.',kind:'record',blocks:[['RULE','Wrong password must not open the account.'],['START / INPUT','Signed out; learner@example.test + Wrong123!.'],['ACTION','Press Sign in once.'],['EXPECTED','Error shown; no signed-in page.']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'quality-example',part:'22 / QUALITY EXAMPLE',title:'Can someone use sign-in without a mouse?',sub:'Proposed classroom accessibility rule: the sign-in form must work by keyboard.',kind:'record',blocks:[['START','Open the fictional sign-in page; put the mouse aside.'],['INPUT','Use Tab, type learner@example.test + Wrong123!.'],['ACTION','Reach Sign in by keyboard; press Enter.'],['EXPECTED','Focus reaches each control; an error is visible and account stays closed.']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'visibility',part:'23 / VISIBILITY',title:'How much can the tester see?',sub:'Use the same wrong-password input and expected error for all three viewpoints.',kind:'flow',steps:[['BLACK','Only form and response'],['GREY','Response + limited log or API clue'],['WHITE','Response + internal code path']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'black-demo',part:'24 / BLACK BOX',title:'Black-box testing',sub:'Input: learner@example.test + Wrong123!. Expected: error; no account opens.',kind:'pixel',panels:[['VISIBLE','Enter details on the sign-in form and inspect the response.'],['HIDDEN','No source code or internal account-lookup information is available.']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'grey-demo',part:'25 / GREY BOX',title:'Grey-box testing',sub:'Same input and expected result; this tester gets a limited account-lookup clue.',kind:'pixel',panels:[['VISIBLE','Sign-in form and response, plus a limited log or API result.'],['HIDDEN','The full password-checking code path remains out of view.']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'white-demo',part:'26 / WHITE BOX',title:'White-box testing',sub:'Same input and expected result; this tester can inspect an internal branch.',kind:'pixel',panels:[['VISIBLE','Sign-in response and the password-checking branch.'],['CHECK','Does the wrong-password branch lead to rejection?']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'view-choice',part:'27 / CHOOSE A VIEW',title:'Which viewpoint is best?',sub:'Choose a viewpoint for the wrong-password risk. Is there one universal winner?',kind:'task',label:'DISCUSS BEFORE REVEAL',body:'Would you start with the <strong>user-visible result</strong>, a <strong>limited log</strong>, or the <strong>password-checking branch</strong>? Why?',hint:'What evidence or access do you have? What question are you trying to answer?',answer:'No universal best. Black-box checks the user-visible rule; grey-box adds a clue when limited internals are available; white-box helps inspect branches. Combine them when useful. None alone proves the whole app is safe.'},
{id:'verification-validation',part:'28 / RETURN TO THE NEED',title:'Built to the rule—or right for people?',sub:'Two questions to ask about the same sign-in page.',kind:'story',panels:[['VERIFICATION','Does the app follow the written rule?'],['VALIDATION','Does that rule meet the real need to keep accounts safe?']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'workshop-brief',part:'29 / TEAM WORKSHOP',title:'Design a mini test suite',sub:'Teams of two or three. Draft three cases on paper or in a shared document.',kind:'lines',rows:[['CASE 1','Correct password opens the right account.'],['CASE 2','Wrong password does not open the account.'],['CASE 3','Five wrong attempts lock the account.']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'workshop-template',part:'30 / COPY THIS STRUCTURE',title:'Make each case runnable',sub:'Use the same five fields for each case; then swap with another team and revise.',kind:'lines',rows:[['TITLE','What are you checking?'],['START','What account state is needed?'],['INPUT','Which exact fictional details or attempt count?'],['STEPS','What does the tester do, in order?'],['EXPECT','What should they see or be unable to do?']],foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'},
{id:'close',part:'31 / TAKE AWAY',title:'The tester’s habit',sub:'Start with a risk that matters. Keep the check small and clear.',kind:'hero',body:'<strong>Rule → input → expected result → actual result → next action.</strong>',foot:'INTRODUCTION TO SOFTWARE TESTING / BLOCK 1'}
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pixelScenes={
 'black-demo':[
  {input:'Wrong123!',gate:'PAGE',status:'EXPECT: ERROR / CLOSED',caption:'The input and expected outcome stay the same across all three viewpoints.',tone:'neutral',move:false},
  {input:'Wrong123!',gate:'PAGE',status:'SEE: FORM + RESPONSE',caption:'Black box: enter the password and compare the visible page with the rule.',tone:'ok',move:true},
  {input:'No code access',gate:'?',status:'INSIDE: UNKNOWN',caption:'The tester cannot see the code or claim to know the cause.',tone:'neutral',move:false}
 ],
 'grey-demo':[
  {input:'Wrong123!',gate:'PAGE',status:'EXPECT: ERROR / CLOSED',caption:'The same sign-in check still asks whether the wrong password is refused.',tone:'neutral',move:false},
  {input:'Wrong123!',gate:'PAGE',status:'SEE: FORM + RESPONSE',caption:'Grey box also sees the user-facing response.',tone:'ok',move:true},
  {input:'Limited clue',gate:'LOG',status:'PLUS: ACCOUNT LOOKUP',caption:'A limited log or API clue can help locate the problem; full code stays hidden.',tone:'ok',move:true}
 ],
 'white-demo':[
  {input:'Wrong123!',gate:'PAGE',status:'EXPECT: ERROR / CLOSED',caption:'The input and expected result are unchanged.',tone:'neutral',move:false},
  {input:'Wrong123!',gate:'PAGE',status:'SEE: FORM + RESPONSE',caption:'White box can still check the user-visible result.',tone:'ok',move:true},
  {input:'if wrong…',gate:'BRANCH',status:'INSPECT: REJECT PATH',caption:'Inspect the password-checking branch: wrong passwords should lead to rejection.',tone:'ok',move:true}
 ]
};
const pixelKey='<svg viewBox="0 0 64 64" aria-hidden="true" shape-rendering="crispEdges"><rect x="8" y="16" width="24" height="24" fill="#6DDDC6"/><rect x="16" y="24" width="8" height="8" fill="#102033"/><rect x="32" y="24" width="24" height="8" fill="#6DDDC6"/><rect x="48" y="32" width="8" height="16" fill="#6DDDC6"/><rect x="40" y="32" width="8" height="8" fill="#6DDDC6"/></svg>';
function pixelContent(s){return `<div class="pixel-layout"><div class="pixel-rules">${s.panels.map(([a,b])=>`<div class="pixel-rule"><div class="eyebrow">${esc(a)}</div><p>${esc(b)}</p></div>`).join('')}</div><div class="pixel-demo" data-demo="${esc(s.id)}"><div class="pixel-screen" data-tone="neutral"><div class="pixel-header">CLASSROOM VIEW / NOT A REAL RUN</div><div class="pixel-input"></div><div class="pixel-track"><div class="pixel-sprite">${pixelKey}</div><div class="pixel-gate"></div></div><div class="pixel-status"></div></div><div class="visibility-map" role="group" aria-label="Information visible to the tester">${[['page','PAGE'],['log','LOG'],['code','CODE']].map(([key,label])=>`<div class="visibility-box" data-box="${key}"><b>${label}</b><span>HIDDEN</span></div>`).join('')}</div><div class="pixel-caption" aria-live="polite"></div><div class="pixel-actions"><button type="button" data-action="play">Play</button><button type="button" data-action="step">Step</button><button type="button" data-action="reset">Reset</button></div></div></div>`}
function content(s){if(s.kind==='hero')return `<div class="hero">${s.body}</div>`;if(s.kind==='centre')return `<div class="question-centre">${s.body}</div>`;if(s.kind==='choice')return `<div class="choice-grid">${s.options.map(([a,b])=>`<div class="choice-card"><b>${esc(a)}</b><p>${esc(b)}</p></div>`).join('')}</div><button type="button" class="reveal" aria-expanded="false">Reveal example answer</button><div class="answer" hidden>${esc(s.answer)}</div>`;if(s.kind==='pixel')return pixelContent(s);if(s.kind==='story')return `<div class="story">${s.panels.map(([label,text],i)=>`<div class="panel ${label==='OBSERVED'?'warning':''}"><div class="eyebrow">${esc(label)}</div><p>${esc(text)}</p></div>`).join('')}</div>`;if(s.kind==='flow')return `<div class="flow">${s.steps.map(([n,t],i)=>`${i?'<div class="arrow" aria-hidden="true">→</div>':''}<div class="step"><div class="num">${esc(n)}</div><p>${esc(t)}</p></div>`).join('')}</div>`;if(s.kind==='lines')return `<div class="lines">${s.rows.map(([a,b])=>`<div class="line"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div>`;if(s.kind==='record')return `<div class="record">${s.blocks.map(([a,b],i)=>`<div class="block ${i>1?'after':''}"><h3>${esc(a)}</h3><p>${esc(b)}</p></div>`).join('')}</div>`;return `<div class="task"><div class="label">${esc(s.label)}</div><p>${s.body}</p><div class="hint">${esc(s.hint)}</div></div><button type="button" class="reveal" aria-expanded="false">Reveal example answer</button><div class="answer" hidden>${esc(s.answer)}</div>`}
const deck=document.getElementById('deck');deck.innerHTML=slides.map((s,i)=>`<section class="slide" id="${esc(s.id)}" aria-label="Slide ${i+1}: ${esc(s.title)}"><div class="kicker">${esc(s.part)}</div><h1 class="title">${esc(s.title)}</h1><p class="subtitle">${esc(s.sub)}</p><div class="content">${content(s)}</div><div class="footer"><span>INTRODUCTION TO SOFTWARE TESTING / BLOCK 1</span><span>${String(i+1).padStart(2,'0')}</span></div></section>`).join('');
const items=[...document.querySelectorAll('.slide')],prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count'),stage=document.getElementById('stage');let index=0;const key='testing-block1-31-slide-revision-position';
const demoStates={};
for(const id of Object.keys(pixelScenes))demoStates[id]={index:0,playing:false,timer:null,remaining:0,deadline:0};
function renderDemo(id,n){const d=demoStates[id],root=document.querySelector(`[data-demo="${id}"]`),f=pixelScenes[id][n],sprite=root.querySelector('.pixel-sprite');d.index=n;root.querySelector('.pixel-screen').dataset.tone=f.tone;root.querySelector('.pixel-input').textContent=`INPUT: ${f.input}`;root.querySelector('.pixel-gate').textContent=f.gate;root.querySelector('.pixel-status').textContent=f.status;root.querySelector('.pixel-caption').textContent=f.caption;const access=id==='black-demo'?['page']:id==='grey-demo'?['page','log']:['page','log','code'],focus=n===1?'page':n===2?id==='black-demo'?'page':id==='grey-demo'?'log':'code':null;for(const box of root.querySelectorAll('.visibility-box')){const allowed=access.includes(box.dataset.box);box.classList.toggle('allowed',allowed);box.classList.toggle('active',allowed&&focus===box.dataset.box);box.querySelector('span').textContent=allowed?'VISIBLE':'HIDDEN';box.setAttribute('aria-label',`${box.dataset.box}: ${allowed?'visible':'hidden'}`)}sprite.classList.remove('travel');sprite.style.animationPlayState='running';void sprite.offsetWidth;if(f.move)sprite.classList.add('travel');root.querySelector('[data-action="step"]').disabled=n===pixelScenes[id].length-1;root.querySelector('[data-action="play"]').textContent=d.playing?'Pause':n===pixelScenes[id].length-1?'Replay':'Play'}
function pauseDemo(id){const d=demoStates[id];if(!d.playing)return;d.playing=false;if(d.timer){d.remaining=Math.max(0,d.deadline-performance.now());clearTimeout(d.timer);d.timer=null}const root=document.querySelector(`[data-demo="${id}"]`);root.querySelector('.pixel-sprite').style.animationPlayState='paused';root.querySelector('[data-action="play"]').textContent='Resume'}
function scheduleDemo(id,delay){const d=demoStates[id];d.remaining=delay;d.deadline=performance.now()+delay;d.timer=setTimeout(()=>{d.timer=null;if(!d.playing)return;const n=d.index+1;renderDemo(id,n);if(n<pixelScenes[id].length-1)scheduleDemo(id,1700);else{d.playing=false;document.querySelector(`[data-demo="${id}"] [data-action="play"]`).textContent='Replay'}},delay)}
function resetDemo(id){const d=demoStates[id];if(d.timer)clearTimeout(d.timer);d.timer=null;d.playing=false;d.remaining=0;renderDemo(id,0)}
for(const id of Object.keys(pixelScenes))resetDemo(id);
deck.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const root=b.closest('[data-demo]'),id=root.dataset.demo,d=demoStates[id],action=b.dataset.action;if(action==='reset'){resetDemo(id);return}if(action==='step'){if(d.timer)clearTimeout(d.timer);d.timer=null;d.playing=false;d.remaining=0;renderDemo(id,Math.min(pixelScenes[id].length-1,d.index+1));return}if(d.playing){pauseDemo(id);return}if(d.index===pixelScenes[id].length-1)resetDemo(id);d.playing=true;root.querySelector('.pixel-sprite').style.animationPlayState='running';root.querySelector('[data-action="play"]').textContent='Pause';scheduleDemo(id,d.remaining||200)});
function fit(){const scale=Math.min(stage.clientWidth/1920,stage.clientHeight/1080);deck.style.transform=`scale(${scale})`;deck.style.left=`${(stage.clientWidth-1920*scale)/2}px`;deck.style.top=`${(stage.clientHeight-1080*scale)/2}px`}
function show(n){const target=Math.max(0,Math.min(items.length-1,n));if(target!==index&&pixelScenes[items[index].id])resetDemo(items[index].id);index=target;items.forEach((el,i)=>{el.classList.toggle('active',i===index);el.setAttribute('aria-hidden',String(i!==index));const a=el.querySelector('.answer'),b=el.querySelector('.reveal');if(a){a.hidden=true;b.setAttribute('aria-expanded','false');b.textContent='Reveal example answer'}});count.textContent=`${String(index+1).padStart(2,'0')} / ${items.length}`;prev.disabled=index===0;next.disabled=index===items.length-1;try{localStorage.setItem(key,String(index))}catch{}history.replaceState(null,'',`#${index+1}`)}
deck.addEventListener('click',e=>{const b=e.target.closest('.reveal');if(!b)return;const a=b.nextElementSibling;a.hidden=!a.hidden;b.setAttribute('aria-expanded',String(!a.hidden));b.textContent=a.hidden?'Reveal example answer':'Hide example answer'});prev.onclick=()=>show(index-1);next.onclick=()=>show(index+1);
window.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,[contenteditable="true"]'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){if(e.key===' '&&e.target.closest('button'))return;e.preventDefault();show(index+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}else if(e.key==='Home')show(0);else if(e.key==='End')show(items.length-1);else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}});
window.addEventListener('resize',fit);window.addEventListener('hashchange',()=>{const n=Number(location.hash.slice(1));if(Number.isInteger(n)&&n>=1&&n<=items.length&&n-1!==index)show(n-1)});try{const h=Number(location.hash.slice(1)),saved=Number(localStorage.getItem(key));index=h>=1&&h<=items.length?h-1:saved>=0&&saved<items.length?saved:0}catch{}show(index);fit();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&pixelScenes[items[index].id])pauseDemo(items[index].id)});
</script></body></html>
